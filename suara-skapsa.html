<div class="rate-wrap reveal"><h1>Form Rating — REVIEW MADING WARS ARJUNA SKAPSA 2025</h1>
<p>Semua data disimpan hanya di perangkat ini. Gunakan <b>Export CSV (lokal)</b> untuk mengunduh data lengkap termasuk komentar.</p>
<div class="card"><label for="nama">Nama (opsional)</label><input id="nama" placeholder="Masukkan nama (opsional)" maxlength="80" autocomplete="name">
<label for="komentar">Komentar (opsional)</label><textarea id="komentar" placeholder="Masukkan komentar atau catatan" maxlength="500"></textarea>
<label>Nilai (1 - 5)</label><div class="stars" id="stars" role="group" aria-label="Nilai bintang"><button type="button" aria-label="1 bintang">☆</button><button type="button" aria-label="2 bintang">☆</button><button type="button" aria-label="3 bintang">☆</button><button type="button" aria-label="4 bintang">☆</button><button type="button" aria-label="5 bintang">☆</button></div>
<div class="flex gap-2"><button class="b-main" id="kirim" type="button">Kirim Penilaian</button><button class="b-soft" id="bersih" type="button">Bersihkan</button></div><p id="msg" role="status"></p></div>
<div class="card" style="padding:1.2rem 1rem"><div>Rata-rata</div><div class="avg" id="avg">0.00</div><div id="total">0 penilaian</div><div style="margin-top:.8rem"><div class="bar"><span>5</span><i><b id="p5"></b></i><span id="c5">0</span></div><div class="bar"><span>4</span><i><b id="p4"></b></i><span id="c4">0</span></div><div class="bar"><span>3</span><i><b id="p3"></b></i><span id="c3">0</span></div><div class="bar"><span>2</span><i><b id="p2"></b></i><span id="c2">0</span></div><div class="bar"><span>1</span><i><b id="p1"></b></i><span id="c1">0</span></div></div>
<div class="flex gap-2 flex-wrap" style="margin-top:1rem"><button class="b-soft" id="export" type="button">Export CSV (lokal)</button><button class="b-red" id="reset" type="button">Reset Semua</button></div></div></div></main><footer class="foot" id="foot"></footer>
